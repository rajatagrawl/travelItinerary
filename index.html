<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-800 tracking-tight">🗺️ Agentic Travel Planner</h1>
            <p class="text-slate-600 mt-2">Powered by Python, LangChain, and Gemini 2.5 Flash</p>
        </header>

        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <label for="prompt" class="block text-sm font-semibold text-slate-700 mb-2">Where are you going and for how long?</label>
            <textarea id="prompt" rows="3" 
                class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none"
                placeholder="e.g., Plan a 3 day budget trip to Paris including popular landmarks."></textarea>
            
            <button id="submitBtn" onclick="generateItinerary()" 
                class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-sm">
                Generate Itinerary via AI Agent
            </button>
        </div>

        <div id="loading" class="hidden text-center py-8">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-2"></div>
            <p class="text-slate-600 font-medium">Agent is thinking, pulling data, and calculating costs...</p>
        </div>

        <div id="outputCard" class="hidden bg-white rounded-xl shadow-md p-6 border-l-4 border-blue-500">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                ✨ Your Custom Itinerary
            </h2>
            <div id="itineraryContent" class="text-slate-700 leading-relaxed whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        async function generateItinerary() {
            const promptInput = document.getElementById('prompt').value;
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const outputCard = document.getElementById('outputCard');
            const itineraryContent = document.getElementById('itineraryContent');

            if (!promptInput.trim()) {
                alert("Please enter a prompt first!");
                return;
            }

            // UI Adjustments for Loading State
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            outputCard.classList.add('hidden');

            try {
                // Fetch request pointing to our FastAPI serverless backend route
                const response = await fetch('/api/agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: promptInput })
                });

                const data = await response.json();

                if (response.ok) {
                    // Display the itinerary markdown text
                    itineraryContent.textContent = data.response;
                    outputCard.classList.remove('hidden');
                } else {
                    itineraryContent.textContent = `Error: ${data.detail || 'Something went wrong.'}`;
                    outputCard.classList.remove('hidden');
                }
            } catch (error) {
                itineraryContent.textContent = `Network Error: ${error.message}`;
                outputCard.classList.remove('hidden');
            } finally {
                // Reset UI States
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
